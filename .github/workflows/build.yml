name: DrumBus Windows VST3
on:
  push:
    branches: [main, feature/linear-phase-rms-v019]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target DrumBus_VST3 --parallel 4
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Directory -Filter 'LM18 DrumBus.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'LM18 DrumBus.vst3 not found' }
          Compress-Archive -Path $plugin.FullName -DestinationPath DrumBus-V0.20-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DrumBus-V0.20-Windows
          path: DrumBus-V0.20-Windows.zip
